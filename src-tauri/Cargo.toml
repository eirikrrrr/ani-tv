[package]
name = "anime-tv"
version = "0.1.0-alpha.9"
description = "Anime TV: escritorio para ver anime con estado en Discord"
edition = "2021"

[lib]
name = "anime_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# open addon configuration pages and links in the system browser
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anime-tv-core = { path = "../core" }
# lazily started torrent engine (OnceCell)
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros"] }

# the embedded player's child window (player.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# src-tauri is its own Cargo workspace (local target dir), independent of the
# root workspace that holds `core`.
[workspace]
