[package]
name = "anime-tv"
version = "0.1.0"
description = "Anime TV: escritorio para ver anime con estado en Discord"
edition = "2021"

[lib]
name = "anime_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anime-tv-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# src-tauri is its own Cargo workspace (local target dir), independent of the
# root workspace that holds `core`.
[workspace]
