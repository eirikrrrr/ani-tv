# Publishes a GitHub release when a version tag is pushed:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Builds the Windows app and attaches the installers, a portable exe and their
# SHA-256 sums. Nothing is published if the build fails or the tag does not
# match the app version.
#
# A tag with a suffix (v0.2.0-alpha.3, -beta.1, -rc.1) is published as a
# *pre-release*; a plain vX.Y.Z is a stable release. The MSI cannot carry a
# text suffix, so src-tauri/tauri.conf.json sets bundle.windows.wix.version to
# X.Y.Z.N (N = the pre-release number).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but src-tauri/tauri.conf.json says $app"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the core
        run: cargo test -p anime-tv-core

      - name: Fetch mpv (pinned build, checksum verified)
        shell: pwsh
        env:
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z
          MPV_SHA256: f259b5fd4b5c395617c948a4fadcdf55bba1c5282fb7c13e88626b3f71072baf
        run: |
          Invoke-WebRequest $env:MPV_URL -OutFile mpv.7z
          $h = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:MPV_SHA256) { throw "mpv checksum mismatch: $h" }
          7z x mpv.7z -osrc-tauri/mpv -y | Out-Null
          Remove-Item -Recurse -Force src-tauri/mpv/installer, src-tauri/mpv/updater.bat -ErrorAction SilentlyContinue
          if (-not (Test-Path src-tauri/mpv/mpv.exe)) { throw "mpv.exe not found in the archive" }
          Get-ChildItem src-tauri/mpv

      - name: Build the Tauri app
        run: npm run tauri build

      - name: Collect the release files
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/anime-tv.exe portable/
          Copy-Item -Recurse src-tauri/mpv portable/mpv
          Compress-Archive -Path portable/* -DestinationPath "release/anime-tv-$v-windows-x64-portable.zip"
          Get-ChildItem release -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          channel=$(echo "$GITHUB_REF_NAME" | sed -nE 's/^v[0-9.]+-(alpha|beta|rc).*/\1/p')
          if [ -n "$channel" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --prerelease \
              --title "Anime TV $GITHUB_REF_NAME ($channel)" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" release/* --latest --title "Anime TV $GITHUB_REF_NAME" "${args[@]}"
          fi
