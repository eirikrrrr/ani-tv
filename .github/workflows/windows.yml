# Builds the Windows app on every push to main (and on demand from the Actions
# tab). Download the result from the run's "Artifacts" section: anime-tv-windows
# holds the installers (NSIS .exe, MSI) and a portable .zip (app + mpv).
# Windows binaries are built on Windows (WebView2 + MSVC).
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the core
        run: cargo test -p anime-tv-core

      - name: Fetch mpv (pinned build, checksum verified)
        shell: pwsh
        env:
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z
          MPV_SHA256: f259b5fd4b5c395617c948a4fadcdf55bba1c5282fb7c13e88626b3f71072baf
        run: |
          Invoke-WebRequest $env:MPV_URL -OutFile mpv.7z
          $h = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:MPV_SHA256) { throw "mpv checksum mismatch: $h" }
          7z x mpv.7z -osrc-tauri/mpv -y | Out-Null
          Remove-Item -Recurse -Force src-tauri/mpv/installer, src-tauri/mpv/updater.bat -ErrorAction SilentlyContinue
          if (-not (Test-Path src-tauri/mpv/mpv.exe)) { throw "mpv.exe not found in the archive" }
          Get-ChildItem src-tauri/mpv

      - name: Build the Tauri app
        run: npm run tauri build

      - name: Collect the build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe build/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi build/
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/anime-tv.exe portable/
          Copy-Item -Recurse src-tauri/mpv portable/mpv
          Compress-Archive -Path portable/* -DestinationPath build/anime-tv-portable.zip
          Get-ChildItem build

      - uses: actions/upload-artifact@v4
        with:
          name: anime-tv-windows
          path: build/*
          if-no-files-found: error
