[package]
name = "anime-tv-core"
version = "0.1.0"
edition = "2021"
description = "Anime TV core: Discord Rich Presence, sources (Torznab/RSS), release-name parsing and ranking"
license = "MIT"

[dependencies]
discord-rich-presence = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
roxmltree = "0.20"
# rustls + ring: no OpenSSL or CMake needed on any OS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
futures = "0.3"
# torrent streaming (torrent.rs): rustls, no OpenSSL
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "fs", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
getrandom = "0.3"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
